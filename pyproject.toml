[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbot"
version = "0.1.0"
description = "A grounded RAG chatbot with tool calling, citations, and regression evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Renu Deepya Iska" }]
keywords = ["rag", "chatbot", "llm", "retrieval", "agents", "evaluation"]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
eval = ["agenteval"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
ragbot = "ragbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
